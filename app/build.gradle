plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'ua.pp.audioeq'
    compileSdk 34

    defaultConfig {
        applicationId "ua.pp.audioeq"
        minSdk 29
        targetSdk 34
        versionCode 6
        versionName "1.5"
    }

    signingConfigs {
        // Явний ключ для CI: докладатись на «магію» debug.keystore не варто — AGP на раннері
        // може взяти інший шлях, і кожна збірка виходить з іншим підписом.
        ci {
            storeFile file(System.getenv('KS_FILE') ?: 'ci.keystore')
            storePassword System.getenv('KS_PASS') ?: 'android'
            keyAlias System.getenv('KEY_ALIAS') ?: 'androiddebugkey'
            keyPassword System.getenv('KEY_PASS') ?: 'android'
            storeType 'JKS'
        }
        release {
            storeFile file(System.getenv('KS_FILE') ?: 'keystore.p12')
            storePassword System.getenv('KS_PASS') ?: ''
            keyAlias System.getenv('KEY_ALIAS') ?: 'poe'
            keyPassword System.getenv('KEY_PASS') ?: ''
            storeType 'PKCS12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.ci
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
